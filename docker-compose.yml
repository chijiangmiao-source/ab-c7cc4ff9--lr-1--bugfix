services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: lr1-review:latest
    container_name: lr1-review-app
    ports:
      - "3000:3000"
    environment:
      PORT: "3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 2s
    restart: unless-stopped

  # One-shot acceptance service. It is not started by a plain `docker compose
  # up`; run it explicitly and its exit code reports the verdict:
  #
  #   docker compose run --rm verify
  #
  # or, building the app image first:
  #
  #   docker compose build app
  #   docker compose --profile verify up --build --abort-on-container-exit --exit-code-from verify
  verify:
    image: lr1-review:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lr1-review-verify
    profiles: ["verify"]
    command: ["node", "verify/verify.js"]
    environment:
      APP_URL: "http://app:3000"
      VERIFY_HEALTH_TIMEOUT_MS: "60000"
    depends_on:
      app:
        condition: service_healthy
    restart: "no"
